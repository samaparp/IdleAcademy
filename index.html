<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14151a" media="(prefers-color-scheme: dark)">
  <title>Idle Academy</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!--
    Icon sprite. One monochrome line system on a 24 grid; see design/Icons.md
    for the rules every symbol is drawn against. Stroke weight and size are
    set from CONFIG, not here, so the set retunes from one place.

    Inline rather than an external file so the game still opens from file://,
    where a fetched sprite would be blocked.
  -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-character" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="3.5"/>
      <path d="M5 20 A7 7 0 0 1 19 20"/>
    </symbol>
    <symbol id="icon-skill" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6"/>
      <path d="M15 15 L20 20"/>
    </symbol>
    <symbol id="icon-inventory" viewBox="0 0 24 24">
      <path d="M4 9 H20 V20 H4 Z"/>
      <path d="M9 9 V6.5 A3 3 0 0 1 15 6.5 V9"/>
    </symbol>
    <symbol id="icon-hunt" viewBox="0 0 24 24">
      <path d="M9.5 5 V4 A2.5 2.5 0 0 1 14.5 4 V5"/>
      <path d="M5.5 5 H18.5"/>
      <path d="M7 5 V17"/>
      <path d="M17 5 V17"/>
      <path d="M5.5 17 H18.5"/>
      <path d="M7 19.5 H17"/>
      <path d="M12 8.8 L14 11.8 L12 14.8 L10 11.8 Z"/>
    </symbol>
    <symbol id="icon-travel" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8"/>
      <path d="M15.5 8.5 L10.5 10.5 L8.5 15.5 L13.5 13.5 Z"/>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M4 7.5 H20"/>
      <path d="M4 12 H20"/>
      <path d="M4 16.5 H20"/>
      <circle cx="9" cy="7.5" r="2"/>
      <circle cx="15" cy="12" r="2"/>
      <circle cx="10" cy="16.5" r="2"/>
    </symbol>
  </svg>
  <header class="app-header">
    <h1 class="app-title">Idle Academy</h1>
    <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
  </header>

  <main class="app-main">
    <p id="save-notice" class="notice" role="status" hidden></p>

    <!-- Character: one field so far. -->
    <section class="panel" id="panel-character" role="tabpanel"
             aria-labelledby="tab-character" tabindex="0" hidden>
      <section class="card field">
        <span class="field__label" id="name-label">Name</span>

        <div class="field__row" id="name-display">
          <span class="field__value" id="character-name">Hunter</span>
          <button type="button" class="icon-button" id="name-edit-button"
                  aria-label="Edit name">
            <span aria-hidden="true">&#9998;&#65038;</span>
          </button>
        </div>

        <div class="field__row" id="name-edit" hidden>
          <input class="field__input" id="name-input" type="text"
                 aria-labelledby="name-label" autocomplete="off"
                 autocapitalize="words" spellcheck="false">
          <button type="button" class="icon-button" id="name-save-button"
                  aria-label="Save name">
            <span aria-hidden="true">&#10003;</span>
          </button>
          <button type="button" class="icon-button" id="name-cancel-button"
                  aria-label="Cancel">
            <span aria-hidden="true">&#10005;</span>
          </button>
        </div>
      </section>
    </section>

    <!-- Skill: skill cards are built from CONFIG by ui.js. -->
    <section class="panel" id="panel-skill" role="tabpanel"
             aria-labelledby="tab-skill" tabindex="0">
      <div class="skill-list" id="skill-list"></div>
    </section>

    <!-- Inventory: nothing designed yet. -->
    <section class="panel" id="panel-inventory" role="tabpanel"
             aria-labelledby="tab-inventory" tabindex="0" hidden>
      <p class="placeholder">Nothing here yet.</p>
    </section>

    <!-- Hunt: locked. The panel exists so unlocking it is a config change. -->
    <section class="panel" id="panel-hunt" role="tabpanel"
             aria-labelledby="tab-hunt" tabindex="0" hidden>
      <p class="placeholder">Nothing here yet.</p>
    </section>

    <!-- Travel: nothing designed yet. -->
    <section class="panel" id="panel-travel" role="tabpanel"
             aria-labelledby="tab-travel" tabindex="0" hidden>
      <p class="placeholder">Nothing here yet.</p>
    </section>

    <!-- Settings: test tools live here for now. -->
    <section class="panel" id="panel-settings" role="tabpanel"
             aria-labelledby="tab-settings" tabindex="0" hidden>
      <details class="card tools">
        <summary class="tools__summary">Test tools</summary>
        <div class="tools__body">
          <div class="tools__row">
            <span class="tools__label" id="speed-label">Speed</span>
            <div class="tools__buttons" id="speed-buttons" role="group" aria-labelledby="speed-label"></div>
          </div>
          <div class="tools__row">
            <button type="button" class="reset" id="reset-button">Reset save</button>
          </div>
        </div>
      </details>
    </section>
  </main>

  <!-- Load order matters: config -> maths -> state -> save -> skills -> engine -> ui -> boot -->
  <script src="js/config.js"></script>
  <script src="js/leveling.js"></script>
  <script src="js/state.js"></script>
  <script src="js/save.js"></script>
  <script src="js/skills/gathering.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
